<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jowtolock 奇安信·网神·云锁 8.0.5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230B2A4A'/%3E%3Cpath d='M9 20c2 2 5 2 7 0s5-2 7 0M10 14c1.5-3 4-4 6-4s4.5 1 6 4' stroke='%2322D3C5' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js';document.head.appendChild(s);"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:13px;color:#333;background:#f0f2f5;overflow:hidden}
.mono{font-family:Consolas,Menlo,"Courier New",monospace}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfd8e0;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶栏 ===== */
#topbar{height:42px;background:linear-gradient(90deg,#0C97E8 0%,#0A86D6 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;z-index:20}
#topbar .tb-left{display:flex;align-items:center;gap:8px;font-size:13px}
#topbar .tb-right{display:flex;align-items:center;gap:22px;font-size:13px}
#topbar .tb-item{display:flex;align-items:center;gap:6px;cursor:pointer;opacity:.95}
#topbar .tb-item:hover{opacity:1}
.avatar{width:22px;height:22px;border-radius:50%;background:#fff;color:#0C95E7;display:inline-flex;align-items:center;justify-content:center}
.tb-ic{height:16px;width:auto;min-width:14px;object-fit:contain;vertical-align:-3px}
.avatar .tb-ic{height:14px;width:auto;min-width:12px}

/* ===== 主体布局 ===== */
#body{display:flex;height:100vh;overflow:hidden}
#side{width:200px;background:#fff;flex:none;display:flex;flex-direction:column;box-shadow:2px 0 6px rgba(0,0,0,.04);z-index:10}
#right{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* ===== Logo 区 ===== */
.brand{padding:14px 0 10px;text-align:center;border-bottom:1px solid #f0f2f5}
.brand .logo{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#123f6e,#081f3a);box-shadow:0 0 0 2px #22D3C5 inset,0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.brand h1{font-size:20px;font-weight:700;color:#222;letter-spacing:.5px;line-height:1.2}
.brand p{font-size:12px;color:#8a94a6;margin-top:2px}

/* ===== 侧栏菜单 ===== */
#menu{flex:1;overflow-y:auto;padding:8px 0}
.m1{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;color:#333;font-size:14px;user-select:none}
.m1:hover{background:#f5f9fc}
.m1 .arrow{margin-left:auto;font-size:10px;color:#9aa5b1;transition:transform .15s}
.m1.open .arrow{transform:rotate(90deg)}
.m1-ic{height:14px;width:auto;min-width:12px;flex:none;object-fit:contain}
.m2{display:flex;align-items:center;gap:7px;padding:9px 14px 9px 38px;cursor:pointer;color:#666;font-size:13px;position:relative;white-space:nowrap}
.m2 .m2-ic{height:15px;width:auto;min-width:13px;flex:none;object-fit:contain}
.m2:hover{color:#1296DB}
.m2.active{background:#E8F6FE;color:#1296DB;font-weight:600}
.m2.active::after{content:"→";position:absolute;right:10px;color:#1296DB;border-right:2px dashed #1296DB;padding-right:6px;font-size:12px}
#sidever{padding:8px 0;text-align:center;color:#9aa5b1;font-size:12px;border-top:1px solid #f0f2f5;flex:none}

/* ===== 面包屑 ===== */
#crumbbar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;border-bottom:1px solid #eef1f4}
#crumb{display:flex;align-items:center;gap:8px;color:#8a94a6;font-size:13px}
#crumb .home{width:20px;height:20px;background:linear-gradient(135deg,#0C97E8,#0A86D6);border-radius:3px;display:inline-flex;align-items:center;justify-content:center}
#crumb .cur{color:#333}
#crumb .sep{color:#c3ccd6}
.func-note{color:#1296DB;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:13px}

/* ===== 内容区 ===== */
#view{flex:1;overflow-y:auto;padding:14px 16px 20px}
.panel{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(30,60,90,.06)}

/* 搜索大框 */
.bigsearch{display:flex;justify-content:center;padding:26px 0 8px}
.bigsearch .box{width:62%;position:relative}
.bigsearch input{width:100%;height:40px;border:2px solid #0C95E7;border-radius:22px;padding:0 70px 0 18px;font-size:13px;outline:none}
.bigsearch .icons{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;gap:14px;color:#7d8b9c;cursor:pointer}
.bigsearch .icons img{height:22px;width:auto;min-width:18px;object-fit:contain;display:block}
.search-links{display:flex;justify-content:flex-end;gap:16px;padding:6px 38% 0 0;font-size:13px}
.search-links .g{color:#9aa5b1;cursor:pointer}
.search-links .b{color:#1296DB;cursor:pointer;display:flex;align-items:center;gap:4px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 16px;border:1px solid #d9dee5;background:#fff;border-radius:4px;color:#555;font-size:13px;cursor:pointer}
.btn:hover{border-color:#0C95E7;color:#0C95E7}
.btn-p{background:#0C95E7;border-color:#0C95E7;color:#fff}
.btn-p:hover{background:#0a86d6;color:#fff}
.btn-g{background:#f2f4f7;border-color:#e6eaf0;color:#a8b3c0;cursor:not-allowed}
.btn-sm{height:26px;padding:0 10px;font-size:12px}

/* 工具条 */
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.kw{width:230px;height:32px;flex:none;border:1px solid #d9dee5;border-radius:4px;display:flex;align-items:center;padding:0 10px;color:#9aa5b1;font-size:13px;gap:8px;cursor:text;white-space:nowrap}
.kw input{border:none;outline:none;flex:1;min-width:0;font-size:13px}

/* Tabs（块式） */
.tabs{display:flex;gap:6px;padding:12px 16px 0;background:#fff;border-radius:6px 6px 0 0}
.tab{display:flex;align-items:center;gap:6px;padding:9px 20px;cursor:pointer;color:#666;font-size:13px;border-radius:4px 4px 0 0;white-space:nowrap}
.tab.active{background:#E6F5FD;color:#1296DB;font-weight:600}
.tab-ic{height:16px;width:auto;min-width:14px;object-fit:contain;flex:none}
.tab.active .tab-ic{filter:none}
/* Tabs（下划线式） */
.utabs{display:flex;gap:28px;padding:14px 16px 0}
.utab{padding:8px 2px;cursor:pointer;color:#666;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.utab.active{color:#1296DB;border-bottom-color:#1296DB;font-weight:600}

/* 表格 */
.tbl-wrap{padding:0 16px 8px}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
.grid th{background:#F5F6F8;color:#5a6572;font-weight:600;text-align:left;padding:10px 8px;border-bottom:1px solid #e8edf2;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid td{padding:10px 8px;border-bottom:1px solid #f0f3f6;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.grid tbody tr{background:#fff}
.grid tbody tr:nth-child(even){background:#fafbfd}
.grid tbody tr:hover{background:#F5FAFE}
.sort{color:#b6c0cb;font-size:10px}
.link{color:#1296DB;cursor:pointer}
.link:hover{text-decoration:underline}
.op-links{display:flex;gap:10px;align-items:center}
.chk{width:15px;height:15px;accent-color:#0C95E7;cursor:pointer}

/* 标签 */
.tag{display:inline-block;padding:2px 10px;border-radius:3px;font-size:12px;line-height:18px;border:1px solid}
.tag-high{color:#F8A83D;border-color:#F8A83D;background:#FDF6EC}
.tag-crit{color:#F0483E;border-color:#F0483E;background:#FDEDEA}
.tag-mid{color:#E6A23C;border-color:#E6A23C;background:#FDF6EC}
.tag-low{color:#0C95E7;border-color:#0C95E7;background:#EBF6FE}
.online{color:#15B26B}
.offline{color:#F0483E}
.ispill{display:inline-block;background:#FDEDEA;color:#F0483E;font-size:11px;border-radius:2px;padding:0 4px;margin-left:4px;line-height:16px}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;color:#666;font-size:13px;flex-wrap:wrap}
.pager select{height:28px;border:1px solid #d9dee5;border-radius:4px;color:#555}
.pg{min-width:28px;height:28px;padding:0 6px;border:1px solid #dfe4ea;background:#fff;border-radius:4px;cursor:pointer;color:#555}
.pg:hover{border-color:#0C95E7;color:#0C95E7}
.pg.on{background:#0C95E7;border-color:#0C95E7;color:#fff}
.pg.dis{background:#f2f4f7;color:#b6c0cb;cursor:not-allowed}
.goto{display:flex;align-items:center;gap:6px}
.goto input{width:44px;height:28px;border:1px solid #d9dee5;border-radius:4px;text-align:center;outline:none}

/* 空态 */
.empty{padding:70px 0;text-align:center;color:#9aa5b1}
.empty .ico{margin:0 auto 14px;width:90px;height:90px;opacity:.8}

/* 资产卡片 */
.asset-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:6px 16px 20px}
.acard{border:1px solid #e8edf2;border-radius:6px;padding:16px;cursor:pointer;background:#fff;transition:all .15s}
.acard:hover{border-color:#0C95E7;box-shadow:0 2px 10px rgba(12,149,231,.15)}
.acard .t{display:flex;align-items:center;gap:7px;color:#555;font-size:13px;margin-bottom:10px}
.acard .v{font-size:24px;font-weight:700;color:#222;font-family:Consolas,monospace}
.acard .s{color:#9aa5b1;font-size:12px;margin-top:6px}
.sec-title{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;font-size:14px;color:#333;font-weight:600}
.sec-title::before{content:"";width:4px;height:16px;background:#0C95E7;border-radius:2px}

/* 统计色块（威胁总览） */
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.statbox{border-radius:6px;padding:16px;display:flex;align-items:center;gap:12px}
.statbox .n{font-size:26px;font-weight:700}
.statbox .u{font-size:13px}
.sc-crit{background:#FDECEA}.sc-crit .n,.sc-crit .u{color:#F0483E}
.sc-high{background:#FDF3E4}.sc-high .n,.sc-high .u{color:#F08A24}
.sc-mid{background:#FCF6E0}.sc-mid .n,.sc-mid .u{color:#E6A23C}
.sc-low{background:#E8F4FD}.sc-low .n,.sc-low .u{color:#0C95E7}

/* 图表卡 */
.chart-row{display:grid;grid-template-columns:1fr 1.1fr 1.2fr;gap:14px;padding:14px 16px}
.chart-card{background:#fff;border-radius:6px;padding:12px 14px;box-shadow:0 1px 3px rgba(30,60,90,.06)}
.chart-card h4{font-size:14px;color:#333;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.chart-card h4::before{content:"";width:4px;height:14px;background:#0C95E7;border-radius:2px}
.chart-box{height:210px}

/* 开关 */
.sw{width:40px;height:20px;border-radius:10px;background:#cdd6e0;position:relative;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center}
.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#0C95E7}
.sw.on::after{left:22px}

/* 弹窗 */
#overlay{position:fixed;inset:0;background:rgba(20,35,55,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 0}
#overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;width:640px;max-width:94vw;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid #f0f2f5;font-size:15px;font-weight:600;color:#333}
.m-head .x{cursor:pointer;color:#9aa5b1;font-size:18px;line-height:1}
.m-head .x:hover{color:#333}
.m-body{padding:18px 22px}
.m-foot{padding:14px 22px;text-align:center;border-top:1px solid #f0f2f5;display:flex;justify-content:center;gap:14px}
.m-title-sub{color:#9aa5b1;font-size:12px;margin-top:4px;font-weight:400}
.dlg-tabs{display:flex;gap:30px;border-bottom:1px solid #eee;margin:6px 0 16px}
.dlg-tab{padding:9px 2px;cursor:pointer;color:#666;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.dlg-tab.active{color:#1296DB;border-bottom-color:#1296DB;font-weight:600}

/* 时间轴（弹窗详情） */
.tl{display:grid;grid-template-columns:34px 1fr;gap:0}
.tl-node{grid-column:1;justify-self:center;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #F5A623;display:flex;align-items:center;justify-content:center;color:#F5A623;z-index:1}
.tl-line{grid-column:1;width:2px;background:#e3e9ef;margin:0 auto;align-self:stretch}
.tl-card{grid-column:2;background:#F7F8FA;border-radius:6px;padding:12px 16px;margin-bottom:14px;font-size:13px;line-height:1.9}
.tl-card.hot{background:#FDF6E7;border-left:3px solid #F5A623}
.tl-card b{font-weight:600;color:#333}
.tl-card .val{font-family:Consolas,monospace;color:#1296DB;font-style:normal}
.tl-label{grid-column:2;display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin-bottom:8px}

/* 表单 */
.frow{display:flex;align-items:center;margin-bottom:16px}
.frow label{width:90px;color:#555;font-size:13px;flex:none}
.frow .req{color:#F0483E;margin-right:3px}
.frow input,.frow select{flex:1;height:34px;border:1px solid #d9dee5;border-radius:4px;padding:0 10px;font-size:13px;outline:none}
.frow input:focus,.frow select:focus{border-color:#0C95E7}
.frow .cnt{flex:none;color:#b6c0cb;font-size:12px;margin-left:8px;width:40px;text-align:right}
.frow .half{flex:1;display:flex;align-items:center;gap:10px}

/* 进程树 */
.ptree{display:flex;gap:0;align-items:stretch}
.ptree-left{display:flex;flex-direction:column;justify-content:space-around;padding:10px 0}
.pnode{background:#fff;border:1px solid #c8d2dc;border-radius:4px;padding:6px 14px;text-align:center;font-family:Consolas,monospace;font-size:13px;color:#333;width:130px}
.pnode.bad{border-color:#F0483E;color:#F0483E;font-style:italic}
.parrow{width:2px;background:#F0483E;margin:4px auto;height:18px;position:relative}
.parrow::after{content:"";position:absolute;bottom:-2px;left:-3px;border:4px solid transparent;border-top-color:#F0483E}
.ptree-detail{flex:1;font-size:12.5px;line-height:1.85;color:#555;padding:4px 0 4px 16px;border-left:1px dashed #e3e9ef;margin-left:8px}
.ptree-detail b{color:#333}
.ptree-detail .val{font-family:Consolas,monospace;color:#1296DB}
.ptree-detail .bad{color:#F0483E}

/* 日志分析 */
.log-layout{display:grid;grid-template-columns:1fr 270px;gap:14px;padding:0 16px}
.log-card{background:#fff;border:1px solid #e8edf2;border-radius:6px;padding:12px 14px;margin-bottom:12px}
.pill{display:inline-block;border:1px solid #0C95E7;color:#1296DB;border-radius:12px;padding:2px 10px;font-size:12px;margin-right:6px;background:#fff}
.pill.gray{border-color:#d9dee5;color:#666}
.pill.purple{border-color:#b07cdb;color:#9b59d0;background:#faf5ff}
.pill.bluefill{background:#E6F5FD;border-color:#9fd8f5;color:#1296DB}
.log-body{margin-top:8px;color:#555;line-height:1.7}
.log-body .src{color:#F0483E}
.log-side .grp{background:#fff;border-radius:6px;padding:10px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(30,60,90,.05)}
.srow{display:flex;justify-content:space-between;padding:7px 0;color:#555;font-size:13px;border-bottom:1px dashed #f0f2f5}
.srow .num{color:#8a94a6;font-family:Consolas,monospace}
.filterbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.rr{color:#F0483E;font-weight:700}

/* toast */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(40,50,65,.92);color:#fff;padding:9px 22px;border-radius:4px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:1200px){.asset-cards{grid-template-columns:repeat(3,1fr)}.chart-row{grid-template-columns:1fr}.log-layout{grid-template-columns:1fr}}
@media(max-width:768px){#view input,#view select,#view textarea{font-size:16px}}
</style>
</head>
<body>
<div id="body">
  <aside id="side">
    <div class="brand">
      <img src="assets/ys/logo.png" style="width:158px;height:auto;display:block;margin:6px auto 0">
    </div>
    <nav id="menu"></nav>
    <div id="sidever">8.0.5 增强版</div>
  </aside>
  <div id="right">
  <div id="topbar">
    <div class="tb-left">
      <img class="tb-ic" src="assets/ys/t-calendar.png">
      <span>2022-08-08 星期一</span>
    </div>
    <div class="tb-right">
      <span class="tb-item" onclick="toast('当前登录用户：（演示）')"><span class="avatar"><img class="tb-ic" src="assets/ys/t-avatar.png"></span>Zg_sinosteel</span>
      <span class="tb-item" onclick="toast('修改密码：演示功能')">
        <img class="tb-ic" src="assets/ys/t-key.png">修改密码</span>
      <span class="tb-item" onclick="toast('已安全退出（演示）')">
        <img class="tb-ic" src="assets/ys/t-power.png">退出系统</span>
    </div>
  </div>
  <main id="main">
    <div id="crumbbar">
      <div id="crumb"></div>
      <div class="func-note" onclick="toast('功能说明：演示')">功能说明
        <img src="assets/ys/modal-gear.png" style="height:14px;width:auto;object-fit:contain;vertical-align:-2px">
      </div>
    </div>
    <div id="view"></div>
  </main>
  </div>
</div>
<div id="overlay"><div class="modal" id="modalbox"></div></div>
<div id="toast"></div>
<script>
/* ================= 基础工具 ================= */
var charts=[];
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show');},1800);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function disposeCharts(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];}
function initChart(dom,opt){if(!window.echarts){return;}var c=echarts.init(dom);c.setOption(opt);charts.push(c);return c;}

/* OS 图标：Windows 四色窗口 / Linux 企鹅 */
function osIcon(os){
  if(os==='Linux'){return '<img src="assets/ys/os-linux.png" style="height:16px;width:auto;object-fit:contain;vertical-align:-3px">';}
  return '<img src="assets/ys/os-windows.png" style="height:16px;width:auto;object-fit:contain;vertical-align:-3px">';
}
/* 菜单小图标 */
var MI={
 info:'<img class="m2-ic" src="assets/ys/sub-info.png">',
 server:'<img class="m2-ic" src="assets/ys/card-server.png">',
 app:'<img class="m2-ic" src="assets/ys/sub-list.png">',
 grid:'<img class="m2-ic" src="assets/ys/sub-fw.png">',
 list:'<img class="m2-ic" src="assets/ys/sub-list.png">',
 risk:'<img class="m2-ic" src="assets/ys/sub-scan.png">',
 bug:'<img class="m2-ic" src="assets/ys/sub-bug.png">',
 chart:'<img class="m2-ic" src="assets/ys/sub-url.png">',
 gear:'<img class="m2-ic" src="assets/ys/sub-gear.png">',

function renderMenu(){
  var html='';
  MENU.forEach(function(m){
    var open=openMenus[m.id];
    if(m.h){}
    html+='<div class="m1" onclick="menuClick(\''+m.id+'\')"><img class="m1-ic" src="assets/ys/'+M1IMG[m.id]+'">'+m.label+'<span class="arrow">▶</span></div>';
    if(open){
      m.children.forEach(function(c){
        var on=(location.hash===c.h);
        var ic=c.ic||'';
        if(on){ic=ic.replace(/(assets\/ys\/)([^"]+?)(\.png)/g,'$1$2-blue$3');}
        html+='<div class="m2'+(on?' active':'')+'" '+(c.h?'onclick="location.hash=\''+c.h+'\'"':'onclick="toast(\''+c.note+'\')"')+'>'+ic+c.label+'</div>';
      });
    }
  });
  document.getElementById('menu').innerHTML=html;
}
function menuClick(id){
  var m=MENU.find(function(x){return x.id===id;});
  if(!m.children.length){toast(m.note||'演示模块');return;}
  openMenus[id]=!openMenus[id];
  renderMenu();
}

var TABICONS={'基础信息':'tab-info.png','离线服务器':'tab-offline.png','硬件配置':'tab-hardware.png','运维信息':'tab-ops.png'};
function tabsBlock(list,active,key,nav,icons){
  var ic=icons||TABICONS;
  return '<div class="tabs">'+list.map(function(t){
    var oc=nav?("location.hash='"+nav(t)+"'"):("setTab('"+key+"','"+t+"')");
    var im=ic&&ic[t]?('<img src="assets/ys/'+ic[t]+'" class="tab-ic">'):'';
    return '<div class="tab'+(t===active?' active':'')+'" onclick="'+oc+'">'+im+t+'</div>';
  }).join('')+'</div>';
}
function grid(cols,heads,rows){
  var h='<table class="grid"><colgroup>'+cols.map(function(w){return '<col style="width:'+w+'%">';}).join('')+'</colgroup><thead><tr><th style="width:34px"><input type="checkbox" class="chk"></th>'+heads.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r+'</tr>';}).join('')+'</tbody></table>';
  return h;
}
function pager(total,pageSize,cur){
  var pages=Math.max(1,Math.ceil(total/pageSize));
  var btns='';
  btns+='<button class="pg dis" onclick="toast(\'演示分页\')">‹</button>';
  var show=[1,2,3,4,5,6];
  show.forEach(function(p){if(p<=pages)btns+='<button class="pg'+(p===cur?' on':'')+'" onclick="toast(\'演示分页：第'+p+'页\')">'+p+'</button>';});
  if(pages>6)btns+='<span style="color:#9aa5b1">…</span><button class="pg" onclick="toast(\'演示分页\')">'+pages+'</button>';
  btns+='<button class="pg" onclick="toast(\'演示分页\')">›</button>';
  return '<div class="pager">共 '+total.toLocaleString()+' 条 <select><option>'+pageSize+'条/页</option><option>15条/页</option><option>30条/页</option></select>'+btns+'<span class="goto">前往 <input value="'+cur+'"> 页</span></div>';
}

/* ================= 路由 ================= */
function render(){
  disposeCharts();
  var h=location.hash||'#/tlock/asset-info';
  var v=VIEWS[h]||VIEWS['#/tlock/asset-info'];
  /* 展开所属菜单 */
  MENU.forEach(function(m){
    if(m.children.some(function(c){return c.h===h;})){openMenus[m.id]=true;}
  });
  renderMenu();
  document.getElementById('crumb').innerHTML='<img src="assets/ys/crumb-tri.png" style="height:22px;width:auto;object-fit:contain;vertical-align:middle;margin-right:2px"><span>网神云锁</span><span class="sep">::</span><span>'+v.crumb[0]+'</span><span class="sep">::</span><span class="cur">'+v.crumb[1]+'</span>';
  document.getElementById('view').innerHTML=v.render();
  if(v.mount)v.mount();
  document.getElementById('view').scrollTop=0;
}
window.addEventListener('hashchange',render);
if(!location.hash){location.hash='#/tlock/asset-info';}
render();
