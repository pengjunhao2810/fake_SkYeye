<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇安信天眼 SkYeye 安全检测平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 13-11 13L5 16z' fill='%230B62B8'/%3E%3Cpath d='M16 9l6 7-6 7-6-7z' fill='%23fff'/%3E%3C/svg%3E">
<script src="assets/echarts.min.js"></script>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",Helvetica,Arial,sans-serif;font-size:13px;color:#333;background:#F0F3F8;overflow:hidden}
a{color:#0B66C7;text-decoration:none;cursor:pointer}
.mono{font-family:Consolas,Menlo,Monaco,monospace}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c8d2e0;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13px;outline:none}

/* ============ 顶部导航 ============ */
#topbar{height:52px;background:linear-gradient(90deg,#0A5BAE 0%,#0B62B8 55%,#1880D8 100%);display:flex;align-items:center;color:#fff;position:relative;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;height:52px;cursor:pointer}
.logo svg{width:30px;height:30px}
.logo span{font-size:18px;font-weight:700;letter-spacing:1px}
.hamburger{width:44px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-left:1px solid rgba(255,255,255,.15)}
.hamburger span{display:block;width:18px;height:2px;background:#fff;position:relative}
.hamburger span::before{content:"";position:absolute;top:-6px;left:0;width:18px;height:2px;background:#fff}
.hamburger span::after{content:"";position:absolute;top:6px;left:0;width:18px;height:2px;background:#fff}
.topnav{display:flex;height:52px;align-items:stretch}
.topnav .tn-item{padding:0 18px;display:flex;align-items:center;font-size:14px;color:rgba(255,255,255,.92);cursor:pointer;position:relative;white-space:nowrap}
.topnav .tn-item:hover{background:rgba(255,255,255,.12)}
.topnav .tn-item.active{background:#0F89F0}
.topright{margin-left:auto;display:flex;align-items:center;gap:16px;padding-right:18px;height:52px}
.topright .tr{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.95);position:relative}
.topright .dot{width:7px;height:7px;border-radius:50%;background:#ff4d4f;position:absolute;top:-2px;right:-6px}
.topright .mail-badge{background:#F5443D;border-radius:9px;font-size:11px;padding:0 6px;line-height:16px;height:16px}
.tr svg{width:18px;height:18px;fill:#fff}

/* ============ 全局 mega menu ============ */
#megamenu{position:fixed;top:52px;left:0;right:0;background:rgba(13,38,72,.97);color:#cfe3f7;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:18px 28px;grid-template-columns:repeat(9,1fr);gap:6px 18px;max-height:78vh;overflow:auto}
#megamenu.open{display:grid}
.mm-col h4{font-size:14px;color:#fff;font-weight:600;padding:6px 0 10px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:8px;position:relative}
.mm-col h4::before{content:"";position:absolute;left:0;bottom:-1px;width:26px;height:2px;background:#2EA8FF}
.mm-col .mm-group-title{font-size:12.5px;color:#7fb8ee;margin:8px 0 3px;cursor:pointer}
.mm-col a{display:block;font-size:12.5px;color:#b8d4f0;padding:3px 0 3px 12px;cursor:pointer;line-height:1.5}
.mm-col a::before{content:"·";color:#2EA8FF;margin-right:5px}
.mm-col a:hover{color:#fff;background:rgba(46,168,255,.15)}

/* ============ 布局 ============ */
#layout{display:flex;height:calc(100vh - 52px - 26px)}
#sidebar{width:196px;flex:0 0 196px;background:linear-gradient(180deg,#0B5AA8 0%,#0E79C4 60%,#1296DB 100%);color:#fff;overflow-y:auto;padding-bottom:20px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#crumb{height:40px;background:#fff;display:flex;align-items:center;padding:0 18px;font-size:12.5px;color:#666;box-shadow:0 1px 2px rgba(0,0,0,.04);gap:6px}
#crumb .sep{color:#bbb}
#crumb .cur{color:#333}
#crumb .right-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
#view{flex:1;overflow-y:auto;padding:14px 16px 30px;position:relative}

/* ============ 侧栏菜单 ============ */
.side-item{display:flex;align-items:center;gap:8px;padding:0 14px;height:42px;font-size:14px;cursor:pointer;color:rgba(255,255,255,.92);white-space:nowrap}
.side-item:hover{background:rgba(255,255,255,.1)}
.side-item.active{background:#0F89F0;border-radius:6px;margin:0 8px;padding:0 10px;height:38px}
.side-item .arr{margin-left:auto;font-size:10px;transition:transform .2s}
.side-item.open .arr{transform:rotate(180deg)}
.side-item svg{width:16px;height:16px;fill:#cfe6ff;flex:0 0 16px}
.side-item img{flex:0 0 auto;align-self:center}
.side-sub{overflow:hidden}
.side-sub .sub-item{display:block;padding:0 14px 0 38px;height:36px;line-height:36px;font-size:13px;color:rgba(255,255,255,.82);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-sub .sub-item::before{content:"·";margin-right:6px;color:#9fd0ff}
.side-sub .sub-item:hover{color:#fff}
.side-sub .sub-item.active{color:#fff;background:rgba(255,255,255,.14);border-radius:0 4px 4px 0}

/* ============ 通用组件 ============ */
.card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(31,56,88,.06);margin-bottom:14px}
.card-title{padding:12px 16px;font-size:14px;font-weight:600;color:#333;border-bottom:1px solid #eef1f6;display:flex;align-items:center}
.card-title .tools{margin-left:auto;display:flex;gap:10px}
.card-body{padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:3px;font-size:13px;padding:0 14px;height:32px;background:#0B66C7;color:#fff}
.btn:hover{background:#0d74dd}
.btn.plain{background:#fff;color:#555;border:1px solid #d9dee6}
.btn.plain:hover{border-color:#0B66C7;color:#0B66C7}
.btn.danger{background:#F5443D}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.query-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:14px 16px;background:#fff;border-radius:4px;margin-bottom:14px}
.q-item{display:flex;align-items:center;gap:8px}
.q-item label{color:#666;white-space:nowrap}
.q-item input,.q-item select{height:30px;border:1px solid #d4dae3;border-radius:3px;padding:0 8px;background:#fff;min-width:150px}
.q-item input::placeholder{color:#9aa5b3}
.tag{display:inline-block;padding:1px 9px;border-radius:3px;font-size:12px;line-height:18px}
.tag-urgent{background:#FDE8E6;color:#F5443D;border:1px solid #F5443D}
.tag-high{background:#FFF4E0;color:#D97A06;border:1px solid #F59E0B}
.tag-mid{background:#FFF7E0;color:#B98200;border:1px solid #F5A623}
.tag-low{background:#E8F1FD;color:#2E7BD6;border:1px solid #4A90E2}
.tag-attempt{background:#FFF3CD;color:#8a6d00;border:1px solid #e8c96a}
.tag-fail{background:#2E7BD6;color:#fff;border:1px solid #2E7BD6}
.tag-info{background:#E8F1FD;color:#2E7BD6}
.tag-blue-solid{background:#2E7BD6;color:#fff}

/* 表格 */
.tbl-wrap{background:#fff;border-radius:4px}
table.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
table.tbl th{background:#F4F6F9;color:#555;font-weight:600;font-size:12.5px;padding:10px 8px;text-align:left;border-bottom:1px solid #e6ebf2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tbl td{padding:9px 8px;font-size:12.5px;border-bottom:1px solid #eef1f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444}
table.tbl tbody tr:hover{background:#F0F7FF}
table.tbl .ip{font-family:Consolas,Menlo,Monaco,monospace;font-size:12px}
.link{color:#2E7BD6;cursor:pointer}
.ops a{margin-right:10px;cursor:pointer;color:#2E7BD6;white-space:nowrap}
.empty{text-align:center;color:#9aa5b3;padding:36px 0;font-size:13px}
.empty .ico{width:90px;height:70px;margin:0 auto 10px;opacity:.5}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;font-size:12.5px;color:#666}
.pager select{height:28px;border:1px solid #d4dae3;border-radius:3px}
.pg-btn{min-width:28px;height:28px;border:1px solid #d9dee6;background:#fff;border-radius:3px;cursor:pointer;color:#555;padding:0 6px}
.pg-btn.on{background:#0B66C7;color:#fff;border-color:#0B66C7}
.pg-btn:disabled{cursor:not-allowed;opacity:.5}
.pager .jump input{width:44px;height:28px;border:1px solid #d4dae3;border-radius:3px;text-align:center}

/* 统计条 */
.stat-bar{display:flex;align-items:center;gap:26px;padding:10px 16px;background:#fff;border-radius:4px;margin-bottom:12px;font-size:12.5px;color:#666}
.stat-bar b{font-size:14px;color:#333}
.stat-bar .st{display:flex;align-items:center;gap:6px}
.st-ico{width:15px;height:15px;border-radius:50%;display:inline-block}

/* 标签页 */
.tabs{display:flex;border-bottom:1px solid #e6ebf2;background:#fff;padding:0 16px;gap:4px}
.tab{padding:0 16px;height:42px;line-height:42px;cursor:pointer;font-size:13px;color:#555;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#0B66C7;border-bottom-color:#0B66C7;font-weight:600}
.tab .lv{font-size:10px;background:#0B66C7;color:#fff;border-radius:3px;padding:0 5px;line-height:15px;height:15px;display:inline-block;margin-left:4px;vertical-align:2px}

/* 详情弹窗 */
#modalMask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none}
#modalMask.open{display:block}
#alertDetail{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:72%;max-height:88vh;background:#fff;border-radius:6px;z-index:201;display:none;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#alertDetail.open{display:flex}
.ad-head{display:flex;justify-content:flex-end;gap:10px;padding:12px 16px;border-bottom:1px solid #eef1f6}
.ad-body{overflow-y:auto;padding:8px 24px 20px}
.ad-section{margin-top:16px}
.ad-section h5{font-size:14px;color:#0B66C7;padding-left:10px;border-left:3px solid #0B66C7;margin-bottom:10px}
.ad-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e6ebf2;border-radius:4px;overflow:hidden}
.ad-grid .cell{display:flex;border-bottom:1px solid #eef1f6;font-size:12.5px}
.ad-grid .cell:nth-last-child(-n+2){border-bottom:none}
.ad-grid .cell:nth-child(odd){border-right:1px solid #eef1f6}
.ad-grid .k{width:110px;flex:0 0 110px;background:#F8FAFC;padding:9px 12px;color:#666}
.ad-grid .v{flex:1;padding:9px 12px;color:#333}
.ad-code{background:#1e2a3a;color:#d8e6f5;border-radius:4px;padding:14px 16px;font-family:Consolas,Menlo,Monaco,monospace;font-size:12px;line-height:1.9;white-space:pre-wrap;word-break:break-all}

/* 客服浮窗 & 页脚 */
#chat{position:fixed;right:22px;bottom:46px;width:48px;height:48px;border-radius:50%;background:#0B66C7;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(11,102,199,.4);z-index:90}
#chat svg{width:22px;height:22px;fill:#fff}
footer{height:26px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9aa5b3;border-top:1px solid #eef1f6}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,30,48,.92);color:#fff;padding:9px 22px;border-radius:4px;font-size:13px;z-index:300;display:none}

/* ============ 仪表板 ============ */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.g-card{height:110px;border-radius:6px;padding:14px 18px;color:#fff;position:relative;overflow:hidden}
.g-card .gc-label{font-size:13px;opacity:.9}
.g-card .gc-main{font-size:30px;font-weight:700;margin-top:8px}
.g-card .gc-sub{font-size:12px;margin-top:4px;opacity:.9}
.g-card .gc-ico{position:absolute;right:14px;top:24px;height:54px;width:auto;max-width:64px;opacity:.9;object-fit:contain}
.gc-1{background:linear-gradient(120deg,#5B8DEF,#7FA8F5)}
.gc-2{background:linear-gradient(120deg,#7B7BE8,#9C8FF0)}
.gc-3{background:linear-gradient(120deg,#1FB6A6,#3CC9B8)}
.gc-4{background:linear-gradient(120deg,#3F8CE8,#5FA8F0)}
.row2{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:14px;margin-bottom:14px}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-cell{text-align:center;padding:12px;border-radius:6px;background:#F8FAFD}
.mini-cell .mc-ico{width:34px;height:34px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.mini-cell .mc-ico svg{width:18px;height:18px}
.mini-cell b{font-size:22px;color:#333}
.mini-cell .mc-sub{font-size:11.5px;color:#8a94a3;margin-top:3px}
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring-legend{flex:1;font-size:12px}
.ring-legend .rl{display:flex;align-items:center;gap:6px;padding:2.5px 0;color:#555}
.ring-legend .rl i{width:10px;height:10px;border-radius:2px;flex:0 0 10px}
.ring-legend .rl span{margin-left:auto;color:#8a94a3}
.huanbi{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 4px}
.huanbi .hb{padding:10px 14px}
.huanbi .hb .t{color:#8a94a3;font-size:12px;display:flex;align-items:center;gap:8px}
.huanbi .hb .v{font-size:26px;font-weight:700;color:#0B66C7;margin-top:8px}
.huanbi .hb .v small{font-size:13px;color:#8a94a3;font-weight:400;margin-left:4px}
.huanbi .up{color:#3CB96A;font-size:12px}

/* ============ 系统监控拓扑 ============ */
#topoBox{background:#fff;border-radius:4px;padding:10px;overflow:hidden}
#topoSvg{width:100%;height:640px}
.topo-legend{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.92);border:1px solid #e0e6ee;border-radius:4px;padding:10px 14px;font-size:12px;color:#555;display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;z-index:5}

/* ============ 工作台 ============ */
.focus-cards{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;background:#fff;border-radius:4px;padding:12px 14px;margin-bottom:14px}
.fc{position:relative;background:linear-gradient(180deg,#F4F9FF,#EAF3FE);border-radius:4px;padding:10px 12px;height:64px;cursor:pointer}
.fc .n{font-size:12px;color:#666}
.fc .v{font-size:24px;font-weight:700;color:#333;margin-top:2px}
.fc .v small{font-size:12px;color:#8a94a3;font-weight:400}
.fc .badge{position:absolute;top:8px;right:8px;background:#F5443D;color:#fff;font-size:11px;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ============ 态势大屏（深色） ============ */
#view.situation-view{padding:0;background:#061225}
.bigscreen{height:calc(100vh - 52px - 26px - 40px);background:radial-gradient(ellipse at 50% 30%,#0b2347 0%,#061225 70%);color:#cfe3f7;position:relative;overflow:hidden;display:flex;flex-direction:stretch}
.bs-panel{background:linear-gradient(180deg,rgba(16,48,96,.55),rgba(8,26,56,.55));border:1px solid rgba(64,140,230,.35);position:relative;margin:10px}
.bs-panel::before,.bs-panel::after{content:"";position:absolute;width:14px;height:14px;border-color:#2EA8FF;border-style:solid}
.bs-panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.bs-panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.bs-panel h6{font-size:13px;color:#8fd0ff;padding:8px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(64,140,230,.25)}
.bs-panel h6::before{content:"";width:4px;height:12px;background:#2EA8FF}
.bs-left{width:250px;flex:0 0 250px;display:flex;flex-direction:column;gap:10px;padding:10px 0 10px 10px}
.bs-right{width:270px;flex:0 0 270px;display:flex;flex-direction:column;gap:10px;padding:10px 10px 10px 0}
.bs-center{flex:1;display:flex;flex-direction:column}
.bs-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#8fd0ff;font-size:13px}
.bs-head .bs-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:6px;text-shadow:0 0 12px rgba(46,168,255,.8)}
.bs-globe{flex:1;position:relative;min-height:0}
.bs-bottom{height:170px;display:flex;gap:10px;padding:0 10px 10px}
.bs-bottom .bs-panel{flex:1}
.bs-stat-num{font-size:26px;font-weight:700;color:#fff;text-align:center}
.bs-list{font-size:12px;padding:8px 12px}
.bs-list .li{display:flex;justify-content:space-between;padding:4px 0;color:#a9c8e8}
.bs-list .li b{color:#fff;font-weight:600}
.apt-orbit{height:120px;position:relative;display:flex;align-items:center;justify-content:center}

/* ============ 高级版 ============ */
.info-banner{background:linear-gradient(90deg,#EAF3FE,#F5F9FF);border:1px solid #BFD9F5;border-radius:4px;padding:11px 16px;color:#3a6ea8;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.flow-steps{display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(180deg,#F0F6FF,#E8F1FD);border-radius:4px;padding:26px 30px;position:relative;margin-bottom:14px}
.fstep{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.fstep .circle{width:64px;height:64px;border-radius:50%;background:#fff;border:6px solid #BFD9F5;display:flex;align-items:center;justify-content:center}
.fstep .circle svg{width:28px;height:28px;stroke:#2E7BD6;fill:none}
.fstep .lbl{font-size:13px;color:#555}
.fstep .arrow{position:absolute;right:-14px;top:26px;width:34px;height:10px;background:linear-gradient(90deg,#9CCBFF,#C8E2FF);clip-path:polygon(0 0,70% 0,70% 35%,100% 50%,70% 65%,70% 100%,0 100%)}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.preview-card .pv{height:280px;border-radius:4px;overflow:hidden;position:relative}
.pv-earth{background:radial-gradient(circle at 50% 45%,#1456a8 0%,#0a2c5e 45%,#061225 100%)}
.pv-cn{background:radial-gradient(circle at 55% 50%,#1a4a8a 0%,#0a2c5e 50%,#061225 100%)}
.badge-ver{font-size:11px;border-radius:3px;padding:1px 8px;margin-left:8px;color:#fff}

/* ============ 挖矿 ============ */
.mining-banner{background:linear-gradient(90deg,#0B62B8,#2E9BEF);border-radius:4px;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-around;margin-bottom:14px}
.mstep{display:flex;align-items:center;gap:10px}
.mstep .mi{width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.mstep .mi svg{width:24px;height:24px;fill:#fff}
.mstep .mt{font-size:12px;opacity:.9}
.mstep .mv{font-size:20px;font-weight:700}
.marrow{color:rgba(255,255,255,.6);font-size:18px}

/* ============ 资产管理 ============ */
.asset-layout{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.tree-box{padding:12px}
.tree-filter{width:100%;height:30px;border:1px solid #d4dae3;border-radius:3px;padding:0 8px;margin-bottom:10px}
.tree-node{padding:5px 4px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;color:#444}
.tree-node:hover{background:#f0f6ff}
.tag-new{font-size:10px;background:#0B66C7;color:#fff;border-radius:3px;padding:0 5px;line-height:15px;height:15px;display:inline-block;margin-left:6px}

/* ============ 日志检索 ============ */
.search-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.idx-pop{position:relative}
.idx-popup{position:absolute;top:36px;left:0;width:640px;background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:18px 24px;z-index:50;display:none}
.idx-popup.open{display:block}
.idx-group{margin-bottom:14px}
.idx-group h6{font-size:13.5px;color:#0B66C7;margin-bottom:8px}

function sidebarFor(route){
  if(['/dashboard','/system-monitor','/workbench','/situation','/situation-pro'].indexOf(route)>=0)return'monitor';

  if(route.indexOf('/log')===0)return'analysis';
  if(route.indexOf('/asset')===0)return'asset';
  if(route.indexOf('/report')===0)return'report';
  if(route.indexOf('/tools')===0)return'more';
  return'monitor';
}
function renderSidebar(route){
  var sec=sidebarFor(route),items=SIDEBARS[sec],h='';
  var IC=function(n){return '<img src="assets/ty/'+n+'" style="height:18px;width:auto;flex:0 0 auto;min-width:18px;max-width:22px;object-fit:contain;vertical-align:middle;display:inline-block">'};
  items.forEach(function(it){
    var active=it.href===('#'+route);
    if(it.children){
      var childActive=it.children.some(function(c){return c.href===('#'+route)});
    if(!childActive && sec==='analysis' && it.t==='行为分析') childActive=true;
      h+='<div class="side-item'+(childActive?' open':'')+'" onclick="toggleSub(this)">'+IC(it.icon)+it.t+'<span class="arr">▼</span></div>';
      h+='<div class="side-sub" style="display:'+(childActive?'block':'none')+'">';

        h+='<a class="sub-item'+(c.href===('#'+route)?' active':'')+'" onclick="navTo(\''+c.href+'\')">'+c.t+'</a>';
      });
      h+='</div>';
    }else{
      h+='<div class="side-item'+(active?' active':'')+'" onclick="navTo(\''+it.href+'\')">'+IC(it.icon)+it.t+'</div>';
    }
  });
  document.getElementById('sidebar').innerHTML=h;
}
function toggleSub(el){
  el.classList.toggle('open');

}

      k++;
    }
  });
  function fmt(d){function z(n){return (n<10?'0':'')+n}return '2022-08-08 '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds())}

 '/alert-yunsuo':function(){renderAlertEmpty('服务器安全管理系统(云锁)')},'/alert-soar':function(){renderAlertEmpty('SOAR自动化编排场景')},
 '/mining':renderMining,'/threat-intel':renderThreatIntel,

 '/log-search':renderLogSearch,'/asset-manage':renderAssetManage,
 '/report':renderReport,'/tools':renderTools
};
function dispatch(){
  var route=currentRoute();
  disposeCharts();
  closeDetail();
  renderSidebar(route);
  renderCrumb(route);
  // 顶栏激活态
  var sec='monitor';
  if(route.indexOf('/alert')===0||['/mining','/threat-intel','/asset-view','/attacker-view'].indexOf(route)>=0)sec='threat';
  else if(route.indexOf('/log')===0)sec='analysis';
  else if(route.indexOf('/asset')===0)sec='asset';
  else if(route.indexOf('/report')===0)sec='report';
  else if(route.indexOf('/tools')===0)sec='more';
  document.querySelectorAll('#topnav .tn-item').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-sec')===sec)});
  var fn=ROUTES[route];
  document.getElementById('view').className='';
  if(fn)fn();else document.getElementById('view').innerHTML=genericEmpty('演示页面');
}
window.addEventListener('hashchange',dispatch);
dispatch();
